<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:transparent;color:#f0e4ee;font:14px system-ui,-apple-system,sans-serif;overflow:hidden}
    #help{color:#dbc5d3;text-align:center;padding:5px 10px 9px;font-size:12px}
    #stage{width:min(calc(100% - 18px),420px);aspect-ratio:540/960;position:relative;margin:auto;border-radius:8px;overflow:hidden;background:#120e16;border:1px solid #ec528d;box-shadow:0 12px 30px #0005;touch-action:none}
    #background{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
    .piece{position:absolute;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;object-fit:fill;}
    .piece:hover,.piece.active{outline:2px dashed #fff;outline-offset:4px;filter:drop-shadow(0 0 4px #ff5da7);z-index:40 !important}
    .piece:active{cursor:grabbing}
    #status{text-align:center;font-size:12px;color:#efaac9;height:22px;margin-top:6px}
  </style>
</head>
<body>
  <div id="help">Trascina stemma, scritte o giocatori. Rilascia per salvare la posizione.</div>
  <div id="stage"><img id="background" alt="Sfondo campo" draggable="false"></div>
  <div id="status" aria-live="polite">Posizioni in coordinate 540 × 960</div>
  <script>
    const stage=document.getElementById('stage');
    const bg=document.getElementById('background');
    const status=document.getElementById('status');
    let positionMap={}, active=null;
    let layers=[];
    const isNumericPair=v=>Array.isArray(v)&&v.length===2&&v.every(n=>Number.isFinite(Number(n)));
    function send(type,data={}){
      window.parent.postMessage({isStreamlitMessage:true,type,...data}, '*');
    }
    function adjustHeight(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.scrollHeight+6)})}
    function paintPositions(){
      document.querySelectorAll('.piece').forEach(el=>{
        const xy=positionMap[el.dataset.id];
        if(!xy)return;
        const dx=Number(el.dataset.dx)||0, dy=Number(el.dataset.dy)||0;
        el.style.left=((xy[0]+dx)/540*100)+'%';
        el.style.top=((xy[1]+dy)/960*100)+'%';
      });
    }
    function makeElement(item, index){
      const el=document.createElement('img');
      el.className='piece'; el.dataset.id=item.id;
      el.dataset.dx=String(item.dx||0); el.dataset.dy=String(item.dy||0);
      el.alt=item.label||item.id;el.title='Trascina: '+(item.label||item.id);
      el.draggable=false;
      el.src='data:image/png;base64,'+item.image;
      el.style.width=(Number(item.width)/540*100)+'%';
      el.style.height=(Number(item.height)/960*100)+'%';
      el.style.zIndex=String(5+index);
      el.addEventListener('pointerdown',ev=>{
        if(ev.button!==0 && ev.pointerType==='mouse')return;
        ev.preventDefault(); ev.stopPropagation();
        active={el,id:item.id,startX:ev.clientX,startY:ev.clientY,initial:[...positionMap[item.id]],moved:false};
        el.classList.add('active'); el.setPointerCapture(ev.pointerId);
        status.textContent=(item.label||item.id)+': '+active.initial.map(Math.round).join(', ');
      });
      el.addEventListener('pointermove',ev=>{
        if(!active||active.el!==el)return;
        ev.preventDefault();
        const r=stage.getBoundingClientRect();
        const dx=(ev.clientX-active.startX)*540/r.width;
        const dy=(ev.clientY-active.startY)*960/r.height;
        positionMap[item.id]=[
          Math.min(540,Math.max(0,Math.round(active.initial[0]+dx))),
          Math.min(960,Math.max(0,Math.round(active.initial[1]+dy)))
        ];
        if(Math.abs(dx)>1||Math.abs(dy)>1)active.moved=true;
        paintPositions();
        status.textContent=(item.label||item.id)+': '+positionMap[item.id].join(', ');
      });
      const finish=ev=>{
        if(!active||active.el!==el)return;
        if(el.hasPointerCapture(ev.pointerId))el.releasePointerCapture(ev.pointerId);
        el.classList.remove('active');
        const wasMoved=active.moved;
        active=null;
        if(wasMoved) send('streamlit:setComponentValue',{value:positionMap,dataType:'json'});
      };
      el.addEventListener('pointerup',finish);
      el.addEventListener('pointercancel',finish);
      return el;
    }
    window.addEventListener('message',event=>{
      const msg=event.data;
      if(!msg || msg.type!=='streamlit:render')return;
      const args=msg.args||{};
      if(active)return;
      bg.src='data:image/png;base64,'+(args.background||'');
      positionMap={};
      for(const [id,xy] of Object.entries(args.positions||{})){
        if(isNumericPair(xy))positionMap[id]=xy.map(Number);
      }
      layers=Array.isArray(args.layers)?args.layers:[];
      stage.querySelectorAll('.piece').forEach(el=>el.remove());
      layers.forEach((layer,i)=>{
        if(positionMap[layer.id])stage.appendChild(makeElement(layer,i));
      });
      paintPositions();adjustHeight();
    });
    window.addEventListener('resize',adjustHeight);
    send('streamlit:componentReady',{apiVersion:1});
    adjustHeight();
  </script>
</body>
</html>
