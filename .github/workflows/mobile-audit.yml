name: Schermate mobile

on:
  push:
    branches: [mobile-audit, 'mobile-*', 'v*-mobile']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Avvia l'app
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
      - run: python tools/mobile_audit.py http://localhost:8501 shots 2>&1 | tee audit.log
        continue-on-error: true
      - name: Pubblica le schermate sul ramo mobile-shots
        if: always()
        run: |
          mkdir -p shots; cp streamlit.log audit.log shots/ || true
          cd shots
          git init -q -b mobile-shots
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git commit -qm "Schermate mobile ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" mobile-shots
