name: Schermate mobile

on:
  push:
    branches: [mobile-audit, 'mobile-*']
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Avvia l'app
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
      - run: python tools/mobile_audit.py http://localhost:8501 shots
      - if: always()
        run: cp streamlit.log shots/ || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermate-mobile
          path: shots/
